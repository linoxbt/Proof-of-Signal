plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ng.proofofsignal.posradio'
version = '1.0.0'

android {
  namespace "ng.proofofsignal.posradio"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // OkHttp is already on the classpath through React Native; this pins a version with a stable EventListener API.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  // Play Integrity standard requests (prepareIntegrityToken / StandardIntegrityTokenProvider).
  implementation "com.google.android.play:integrity:1.6.0"
}
