# Supabase CLI project config. `supabase start` runs the stack locally;
# `supabase db push` applies supabase/migrations to the linked project.
project_id = "proof-of-signal"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Devices authenticate with their own signing key, not a Supabase JWT, and the
# function verifies reviewer JWTs itself (contracts/api.md, "Auth").
[functions.api]
verify_jwt = false
