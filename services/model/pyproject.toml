[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-model"
version = "0.1.0"
description = "Proof of Signal coverage model: features, LightGBM, calibration, conformal intervals, Beta-Binomial update, freeze"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "h3>=4.0",
  "psycopg[binary]>=3.1",
  "rasterio>=1.3",
  "pyarrow>=15",
]

[project.optional-dependencies]
# Download/loader scripts in data/ (DuckDB httpfs for Ookla, pyogrio for GRID3 GeoPackages).
data = ["duckdb>=1.0", "requests>=2.31", "pyogrio>=0.7", "shapely>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
pos-model = "pos_model.cli:main"

[tool.setuptools]
packages = ["pos_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a local Postgres + PostGIS (POS_MODEL_TEST_DB_URL or DATABASE_URL)"]
