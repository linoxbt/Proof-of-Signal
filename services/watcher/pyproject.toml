[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-watcher"
version = "0.1.0"
description = "Proof of Signal election-night watcher: IReV first-seen times, system stalls, three-cause flags"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "tenacity>=8.2",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Only needed if the live IReV portal turns out to need a real browser.
browser = ["playwright>=1.44"]

[project.scripts]
pos-watcher = "pos_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["pos_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a dev Postgres (DATABASE_URL or PGDEV_PORT=54333 scripts/db-dev.sh start)"]
